<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de pedido</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<div class="container">
    <h1>Detalle del pedido</h1>
    <p><strong>ID:</strong> <span th:text="${invoice.id}"></span></p>
    <p><strong>Tipo:</strong> <span th:text="${invoice.type}"></span></p>
    <p><strong>Fecha:</strong> <span th:text="${invoice.date}"></span></p>
    <p><strong>Cliente:</strong> <span th:text="${invoice.customer.name}"></span></p>

    <table>
        <tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr>
        <tr th:each="d : ${details}">
            <td th:text="${d.product.name}"></td>
            <td th:text="${d.quantity}"></td>
            <td th:text="${d.price}"></td>
            <td th:text="${d.subtotal}"></td>
        </tr>
    </table>
    <h2>Total: S/ <span th:text="${total}"></span></h2>
    <a class="button" th:href="@{/orders}">Volver</a>
</div>
</body>
</html>
